# 対話shellの初期化順序はこのファイルの並び順で決まる。
# 順序の制約:
#   - zsh-completions (fpath追加) は zsh-completion (compinit) より前
#   - zsh-functions は widget を定義するので zsh-autosuggestions より前
#   - zsh-syntax-highlighting は最後
shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.powerlevel10k]
github = "romkatv/powerlevel10k"
hooks.post = """
[[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh
(( ! ${+functions[p10k]} )) || p10k finalize
"""

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

# 自前設定 (即時)。最初のpromptより前に効いている必要があるもの。
# sheldonは use 内のファイルを名前順にsourceするので、順序が要るものは1ファイル1 pluginにする
[plugins.zsh-options]
local = "~/.config/zsh"
use = ["options.zsh"]

[plugins.zsh-completion]
local = "~/.config/zsh"
use = ["completion.zsh"]

[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"
hooks.pre = """
unset HISTORY_SUBSTRING_SEARCH_PREFIXED
export HISTORY_SUBSTRING_SEARCH_ENSURE_UNIQUE=1
"""
hooks.post = """
bindkey '^[[A' history-substring-search-up
bindkey '^[[B' history-substring-search-down
# enable arrow key bindings (terminfo が無い環境では skip)
[[ -n "$terminfo[kcuu1]" ]] && bindkey "$terminfo[kcuu1]" history-substring-search-up
[[ -n "$terminfo[kcud1]" ]] && bindkey "$terminfo[kcud1]" history-substring-search-down
# enable emacs-style keybindings
bindkey -M emacs '^P' history-substring-search-up
bindkey -M emacs '^N' history-substring-search-down
"""

# 自前設定 (遅延)。最初のpromptに不要なもの
[plugins.zsh-functions]
local = "~/.config/zsh"
use = ["functions.zsh"]
apply = ["defer"]

[plugins.zsh-aliases]
local = "~/.config/zsh"
use = ["aliases.zsh"]
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

[plugins.256color]
github = "chrissicool/zsh-256color"
apply = ["defer"]

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]
