#:schema https://mise.en.dev/schema/mise.json

[tools]
apm = "latest"
"conda:eza" = "latest"
"github:metaspartan/mactop" = "latest"
imagemagick = "latest"
resvg = "latest"
swiftlint = "latest"
tree-sitter = "latest"

"pypi:headroom-ai" = { version = "latest", extras = "proxy,code", postinstall = '''
    launchctl kickstart -k gui/$(id -u)/dev.mise.headroom-proxy 2>/dev/null || true
''' }
"github:router-for-me/CLIProxyAPI" = { version = "latest", minimum_release_age = "0s", postinstall = '''
    launchctl kickstart -k gui/$(id -u)/dev.mise.cli-proxy-api 2>/dev/null || true
''' }
"github:mjun0812/yobirin" = { version = "latest", minimum_release_age = "0s", asset_pattern = "yobirin", postinstall = '''
    yobirin install
    yobirin install --profile claude --icon ~/.dotfiles/assets/notify-claude.png
    yobirin install --profile codex --icon ~/.dotfiles/assets/notify-codex.png
''' }

[bootstrap.packages]
# For macOS
"brew:acsandmann/tap/rift" = "latest"
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:ffmpeg" = "latest"
"brew:git" = "latest"
"brew:htop" = "latest"
"brew:jq" = "latest"
"brew:librsvg" = "latest"
"brew:lld" = "latest"
"brew:llvm" = "latest"
"brew:mysql" = "latest"
"brew:openssl@3" = "latest"
"brew:subversion" = "latest"
"brew:tree" = "latest"
"brew:vite-plus" = "latest"
"brew:wget" = "latest"
"brew:watch" = "latest"
"brew-cask:alt-tab" = "latest"
"brew-cask:bettertouchtool" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:drawio" = "latest"
"brew-cask:font-roboto-mono-nerd-font" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:homerow" = "latest"
"brew-cask:iterm2" = "latest"
"brew-cask:keycastr" = "latest"
"brew-cask:ollama-app" = "latest"
"brew-cask:thaw" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:mjun0812/roboto-mono-jp/font-roboto-mono-jp" = "latest"
"brew-cask:clipy" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:balenaetcher" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:nani" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:codexbar" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:inkscape" = "latest"
"brew-cask:wezterm@nightly" = "latest"
"brew-cask:azookey" = "latest"
"brew-cask:ci7lus/miraktest/miraktest" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:xquartz" = "latest"
"brew-cask:mactex-no-gui" = "latest"
"brew-cask:nikitabobko/tap/aerospace" = "latest"
"brew-cask:orbstack" = "latest"

[bootstrap.brew.taps]
"acsandmann/tap" = "https://github.com/acsandmann/homebrew-tap.git"
"ci7lus/miraktest" = "https://github.com/ci7lus/homebrew-miraktest.git"
"mjun0812/roboto-mono-jp" = "https://github.com/mjun0812/homebrew-roboto-mono-jp.git"
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap.git"

[bootstrap.services.rift]
scope = "user"
description = "Start the Rift window manager"
command = "~/.dotfiles/script/services/rift.sh"
# メニューのQuit Riftで正常終了したときは起動し直さない
restart = "on-failure"

[tasks.no-sleep-mac]
description = "No Sleep Mode for macOS (runs in background)"
run = "nohup caffeinate -dims >/dev/null 2>&1 &"

[tasks.no-sleep-mac-stop]
description = "Stop No Sleep Mode for macOS"
run = "pkill -f 'caffeinate -dims'"

# caffeinateはアイドルスリープしか止めないので、蓋を閉じたときのスリープはpmsetで止める。
# disablesleepはプロセスに紐づかず、stopを実行するまで有効なまま残る
[tasks.no-sleep-mac-closed]
description = "Keep macOS awake even with the lid closed (needs sudo)"
run = "sudo pmset disablesleep 1"

[tasks.no-sleep-mac-closed-stop]
description = "Allow macOS to sleep on lid close again"
run = "sudo pmset disablesleep 0"

[tasks.no-sleep-mac-status]
description = "Show whether no-sleep-mac and no-sleep-mac-closed are active"
# pmset -gはdisablesleepが0のときSleepDisabledの行を出さない
run = """
pgrep -fl 'caffeinate -dims' || echo 'caffeinate -dims: not running'
pmset -g | grep SleepDisabled || echo 'SleepDisabled 0'
"""

# Quit Riftの正常終了ではlaunchdが起動し直さない (restart = "on-failure") ので、手で起動し直す。
# -kで、動いている場合も止めてから起動する
[tasks.rift-restart]
description = "Restart the Rift window manager via launchd"
run = "launchctl kickstart -k gui/$(id -u)/dev.mise.rift"
