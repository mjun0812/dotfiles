#:schema https://mise.en.dev/schema/mise.json

[tools]
"pipx:headroom-ai" = { version = "latest", extras = "proxy,code", postinstall = "launchctl kickstart -k gui/$(id -u)/dev.mise.headroom-proxy 2>/dev/null || true" }
"github:router-for-me/CLIProxyAPI" = { version = "latest", postinstall = "launchctl kickstart -k gui/$(id -u)/dev.mise.cli-proxy-api 2>/dev/null || true" }
"pipx:plamo-translate" = "latest"
"github:mjun0812/yobirin" = { version = "latest", asset_pattern = "yobirin", minimum_release_age = "0s", postinstall = "yobirin install && yobirin install --profile claude --icon ~/.dotfiles/assets/notify-claude.png && yobirin install --profile codex --icon ~/.dotfiles/assets/notify-codex.png" }

[bootstrap.packages]
# For macOS
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:ffmpeg" = "latest"
"brew:git" = "latest"
"brew:gitleaks" = "latest"
"brew:htop" = "latest"
"brew:librsvg" = "latest"
"brew:llvm" = "latest"
"brew:mactop" = "latest"
"brew:mcat" = "latest"
"brew:mysql" = "latest"
"brew:ninja" = "latest"
"brew:resvg" = "latest"
"brew:subversion" = "latest"
"brew:swiftlint" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:watch" = "latest"
"brew-cask:alt-tab" = "latest"
"brew-cask:bettertouchtool" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:drawio" = "latest"
"brew-cask:font-roboto-mono-nerd-font" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:homerow" = "latest"
"brew-cask:iterm2" = "latest"
"brew-cask:keycastr" = "latest"
"brew-cask:ollama-app" = "latest"
"brew-cask:thaw@beta" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:mjun0812/roboto-mono-jp/font-roboto-mono-jp" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:clipy" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:balenaetcher" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:nani" = "latest"
"brew-cask:deepl" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:codexbar" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:inkscape" = "latest"
"brew-cask:wezterm@nightly" = "latest"

[bootstrap.macos.launchd.agents.headroom-proxy]
program = "~/.local/share/mise/shims/headroom"
args = [
  "proxy",
  "--host",
  "127.0.0.1",
  "--port",
  "8787",
  "--mode",
  "token",
  "--no-telemetry",
  "--disable-kompress",
  "--lossless",
  "--code-aware",
  "--intercept-tool-results",
]
run_at_load = true
keep_alive = true
kickstart = true

[bootstrap.macos.launchd.agents.cli-proxy-api]
program = "~/.local/share/mise/shims/cli-proxy-api"
working_directory = "~/.config/cli-proxy-api"
run_at_load = true
keep_alive = true
kickstart = true

[bootstrap.macos.launchd.agents.codex-remote-control]
program = "~/.codex/packages/standalone/current/codex"
args = ["app-server", "daemon", "start"]
run_at_load = true
kickstart = true

[bootstrap.brew.taps]
"mjun0812/roboto-mono-jp" = "https://github.com/mjun0812/homebrew-roboto-mono-jp.git"

[tasks.no-sleep-mac]
description = "No Sleep Mode for macOS"
run = "caffeinate -dims"

[tasks.headroom-restart]
description = "Restart the Headroom proxy launchd agent"
run = "launchctl kickstart -k gui/$(id -u)/dev.mise.headroom-proxy"

[tasks.cli-proxy-api-restart]
description = "Restart the CLIProxyAPI launchd agent"
run = "launchctl kickstart -k gui/$(id -u)/dev.mise.cli-proxy-api"
