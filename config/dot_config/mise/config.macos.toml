#:schema https://mise.en.dev/schema/mise.json

[tools]
apm = "latest"
"cargo:eza" = "latest"
"github:metaspartan/mactop" = "latest"
imagemagick = "latest"
powershell = "latest"
resvg = "latest"
swiftlint = "latest"
tree-sitter = "latest"

container = { version = "latest", postinstall = '''
container system start --disable-kernel-install
container system kernel set --recommended --force
''' }
"pypi:headroom-ai" = { version = "latest", extras = "proxy,code", postinstall = '''
    launchctl kickstart -k gui/$(id -u)/dev.mise.headroom-proxy 2>/dev/null || true
''' }
"github:router-for-me/CLIProxyAPI" = { version = "latest", minimum_release_age = "0s", postinstall = '''
    launchctl kickstart -k gui/$(id -u)/dev.mise.cli-proxy-api 2>/dev/null || true
''' }
"github:mjun0812/yobirin" = { version = "latest", minimum_release_age = "0s", asset_pattern = "yobirin", postinstall = '''
    yobirin install
    yobirin install --profile claude --icon ~/.dotfiles/assets/notify-claude.png
    yobirin install --profile codex --icon ~/.dotfiles/assets/notify-codex.png
''' }

[bootstrap.packages]
# For macOS
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:ffmpeg" = "latest"
"brew:git" = "latest"
"brew:htop" = "latest"
"brew:librsvg" = "latest"
"brew:lld" = "latest"
"brew:llvm" = "latest"
"brew:mysql" = "latest"
"brew:subversion" = "latest"
"brew:tree" = "latest"
"brew:vite-plus" = "latest"
"brew:wget" = "latest"
"brew:watch" = "latest"
"brew-cask:alt-tab" = "latest"
"brew-cask:bettertouchtool" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:drawio" = "latest"
"brew-cask:font-roboto-mono-nerd-font" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:homerow" = "latest"
"brew-cask:iterm2" = "latest"
"brew-cask:keycastr" = "latest"
"brew-cask:ollama-app" = "latest"
"brew-cask:thaw" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:mjun0812/roboto-mono-jp/font-roboto-mono-jp" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:clipy" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:balenaetcher" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:nani" = "latest"
"brew-cask:deepl" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:codexbar" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:inkscape" = "latest"
"brew-cask:wezterm@nightly" = "latest"
"brew-cask:azookey" = "latest"
"brew-cask:ci7lus/miraktest/miraktest" = "latest"
