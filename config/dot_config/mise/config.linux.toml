#:schema https://mise.en.dev/schema/mise.json

[tools]
"github:eza-community/eza" = "latest"
# aqua の yazi は glibc 2.39 を要求する gnu build を選ぶため、Linux では静的リンクの musl build を使う
"github:sxyazi/yazi" = { version = "latest", matching = "musl", strip_components = 1, postinstall = "ya pkg install" }
# tree-sitter の prebuilt binary は glibc 2.39 を要求し musl build も無いため、Linux ではソースからビルドする
"cargo:tree-sitter-cli" = "latest"
# apm の prebuilt binary (PyInstaller) は glibc 2.38 を要求するため、Linux では PyPI の apm-cli を使う。
# apm-cli は requires-python >= 3.10 を宣言しつつ typing.Self (3.11+) を使うので、system python を避けて 3.12 を指定する
"pipx:apm-cli" = { version = "latest", uvx_args = "--python 3.12" }
# headroom-ai は Python >= 3.10 を要求するが、uv は system の python3 (Rocky 9 では 3.9) を優先するため Python 要件を明示する
"pipx:headroom-ai" = { version = "latest", extras = "proxy,code", uvx_args = "--python >=3.10" }
"github:router-for-me/CLIProxyAPI" = "latest"

[bootstrap.linux.systemd.units.codex-remote-control]
description = "Start the Codex Remote Control daemon"
type = "oneshot"
remain_after_exit = true
exec_start = "~/.codex/packages/standalone/current/codex app-server daemon start"
exec_stop = "~/.codex/packages/standalone/current/codex app-server daemon stop"
