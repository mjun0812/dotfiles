#:schema https://mise.en.dev/schema/mise.json

[tools]
"github:eza-community/eza" = "latest"
"conda:tree-sitter-cli" = "latest"
"pypi:apm-cli" = { version = "latest" }
# headroom-aiはPython >= 3.10を要求するが、uvはsystemのpython3 (Rocky 9では3.9) を優先するためPython要件を明示する
"pypi:headroom-ai" = { version = "latest", extras = "proxy,code", postinstall = '''
    systemctl --user restart dev.mise.headroom-proxy.service 2>/dev/null || true
''' }
"github:router-for-me/CLIProxyAPI" = { version = "latest", minimum_release_age = "0s", postinstall = '''
    systemctl --user restart dev.mise.cli-proxy-api.service 2>/dev/null || true
''' }
"aqua:imagemagick" = "latest"

# Playwriterの拡張機能入りブラウザを~/.playwriter/browser-profileで常駐させる。
# 画面が無ければheadlessで起動する
[bootstrap.services.playwriter-browser]
scope = "user"
description = "Start the Playwriter browser"
command = "~/.dotfiles/script/services/playwriter-browser.sh"
restart = "always"
requires_tools = true
