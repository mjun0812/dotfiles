#:schema https://mise.en.dev/schema/mise.json

# config/dotとconfig/dot_configにファイルを足したら、ここにもエントリを足す
[dotfiles]
"~/.editorconfig" = "~/.dotfiles/config/dot/editorconfig"
"~/.emacs" = "~/.dotfiles/config/dot/emacs"
"~/.gitconfig" = "~/.dotfiles/config/dot/gitconfig"
"~/.gitignore" = "~/.dotfiles/config/dot/gitignore"
"~/.hammerspoon" = "~/.dotfiles/config/dot/hammerspoon"
"~/.npmrc" = "~/.dotfiles/config/dot/npmrc"
"~/.p10k.zsh" = "~/.dotfiles/config/dot/p10k.zsh"
"~/.python-version" = "~/.dotfiles/config/dot/python-version"
"~/.tmux.conf" = "~/.dotfiles/config/dot/tmux.conf"
"~/.wezterm.lua" = "~/.dotfiles/config/dot/wezterm.lua"
"~/.zlogin" = "~/.dotfiles/config/dot/zlogin"
"~/.zlogout" = "~/.dotfiles/config/dot/zlogout"
"~/.zprofile" = "~/.dotfiles/config/dot/zprofile"
"~/.zshenv" = "~/.dotfiles/config/dot/zshenv"
"~/.zshrc" = "~/.dotfiles/config/dot/zshrc"

"~/.config/aerospace" = "~/.dotfiles/config/dot_config/aerospace"
"~/.config/bat" = "~/.dotfiles/config/dot_config/bat"
"~/.config/bun" = "~/.dotfiles/config/dot_config/bun"
"~/.config/eza" = "~/.dotfiles/config/dot_config/eza"
"~/.config/ghostty" = "~/.dotfiles/config/dot_config/ghostty"
"~/.config/mise" = "~/.dotfiles/config/dot_config/mise"
"~/.config/nvim" = "~/.dotfiles/config/dot_config/nvim"
"~/.config/pnpm" = "~/.dotfiles/config/dot_config/pnpm"
"~/.config/rift" = "~/.dotfiles/config/dot_config/rift"
"~/.config/ruff" = "~/.dotfiles/config/dot_config/ruff"
"~/.config/sheldon" = "~/.dotfiles/config/dot_config/sheldon"
"~/.config/starship.toml" = "~/.dotfiles/config/dot_config/starship.toml"
"~/.config/uv" = "~/.dotfiles/config/dot_config/uv"
"~/.config/zsh" = "~/.dotfiles/config/dot_config/zsh"
# アプリが同じディレクトリに状態を書くので、ディレクトリは実体にしてファイルだけをlinkする
"~/.config/cli-proxy-api/config.yaml" = "~/.dotfiles/config/dot_config/cli-proxy-api/config.yaml"
"~/.config/herdr/config.toml" = "~/.dotfiles/config/dot_config/herdr/config.toml"
"~/.config/hunk/config.toml" = "~/.dotfiles/config/dot_config/hunk/config.toml"

# Codexが書き足すローカル状態 ([projects.*]や[hooks.state]) を残し、テンプレートのキーだけを書き込む
"~/.codex/config.toml/dotfiles" = { source = "~/.dotfiles/config/ai-agents/codex/config.toml", merge = true }
"~/.codex-bare/config.toml/dotfiles" = { source = "~/.dotfiles/config/ai-agents/codex-bare/config.toml", merge = true }
# Antigravity CLIは起動のたびにファイルを書き直し、trustedWorkspacesを書き足すので、symlinkにできない
"~/.gemini/antigravity-cli/settings.json/dotfiles" = { source = "~/.dotfiles/config/ai-agents/gemini/antigravity-cli/settings.json", merge = true }

# agent向け。AGENTS_global.mdはCodexとGeminiが同じファイルを読む
"~/.apm/apm.yml" = "~/.dotfiles/config/ai-agents/apm.yml"
"~/.claude-bare/settings.json" = "~/.dotfiles/config/ai-agents/claude-bare/settings.json"
"~/.claude/CLAUDE.md" = "~/.dotfiles/config/ai-agents/claude/CLAUDE.md"
"~/.claude/rules" = "~/.dotfiles/config/ai-agents/rules"
"~/.claude/settings.json" = "~/.dotfiles/config/ai-agents/claude/settings.json"
"~/.claude/statusline.py" = "~/.dotfiles/config/ai-agents/claude/statusline.py"
"~/.claude/subagent_statusline.py" = "~/.dotfiles/config/ai-agents/claude/subagent_statusline.py"
"~/.codex-bare/hooks.json" = "~/.dotfiles/config/ai-agents/codex-bare/hooks.json"
"~/.codex-bare/rules/manual-approval.rules" = "~/.dotfiles/config/ai-agents/codex/rules/manual-approval.rules"
"~/.codex/AGENTS.md" = "~/.dotfiles/config/ai-agents/AGENTS_global.md"
"~/.codex/hooks.json" = "~/.dotfiles/config/ai-agents/codex/hooks.json"
"~/.codex/rules/manual-approval.rules" = "~/.dotfiles/config/ai-agents/codex/rules/manual-approval.rules"
"~/.gemini/GEMINI.md" = "~/.dotfiles/config/ai-agents/AGENTS_global.md"
"~/.textlintrc.js" = "~/.dotfiles/config/textlint/textlintrc.js"

# APMと展開先を共有するため、私用skillのディレクトリだけをlinkする
"~/.agents/skills/mjun-grilling" = "~/.dotfiles/config/ai-agents/skills/mjun-grilling"
"~/.agents/skills/mjun-implement" = "~/.dotfiles/config/ai-agents/skills/mjun-implement"
"~/.agents/skills/mjun-orchestrate" = "~/.dotfiles/config/ai-agents/skills/mjun-orchestrate"
"~/.agents/skills/mjun-rule-lint" = "~/.dotfiles/config/ai-agents/skills/mjun-rule-lint"
"~/.agents/skills/mjun-spec-review" = "~/.dotfiles/config/ai-agents/skills/mjun-spec-review"
"~/.agents/skills/mjun-specify" = "~/.dotfiles/config/ai-agents/skills/mjun-specify"
"~/.agents/skills/mjun-start" = "~/.dotfiles/config/ai-agents/skills/mjun-start"
"~/.agents/skills/mjun-steering" = "~/.dotfiles/config/ai-agents/skills/mjun-steering"
"~/.agents/skills/mjun-to-tasks" = "~/.dotfiles/config/ai-agents/skills/mjun-to-tasks"

"~/.claude/skills/mjun-grilling" = "~/.dotfiles/config/ai-agents/skills/mjun-grilling"
"~/.claude/skills/mjun-implement" = "~/.dotfiles/config/ai-agents/skills/mjun-implement"
"~/.claude/skills/mjun-orchestrate" = "~/.dotfiles/config/ai-agents/skills/mjun-orchestrate"
"~/.claude/skills/mjun-rule-lint" = "~/.dotfiles/config/ai-agents/skills/mjun-rule-lint"
"~/.claude/skills/mjun-spec-review" = "~/.dotfiles/config/ai-agents/skills/mjun-spec-review"
"~/.claude/skills/mjun-specify" = "~/.dotfiles/config/ai-agents/skills/mjun-specify"
"~/.claude/skills/mjun-start" = "~/.dotfiles/config/ai-agents/skills/mjun-start"
"~/.claude/skills/mjun-steering" = "~/.dotfiles/config/ai-agents/skills/mjun-steering"
"~/.claude/skills/mjun-to-tasks" = "~/.dotfiles/config/ai-agents/skills/mjun-to-tasks"

"~/.gemini/antigravity-cli/skills/mjun-grilling" = "~/.dotfiles/config/ai-agents/skills/mjun-grilling"
"~/.gemini/antigravity-cli/skills/mjun-implement" = "~/.dotfiles/config/ai-agents/skills/mjun-implement"
"~/.gemini/antigravity-cli/skills/mjun-orchestrate" = "~/.dotfiles/config/ai-agents/skills/mjun-orchestrate"
"~/.gemini/antigravity-cli/skills/mjun-rule-lint" = "~/.dotfiles/config/ai-agents/skills/mjun-rule-lint"
"~/.gemini/antigravity-cli/skills/mjun-spec-review" = "~/.dotfiles/config/ai-agents/skills/mjun-spec-review"
"~/.gemini/antigravity-cli/skills/mjun-specify" = "~/.dotfiles/config/ai-agents/skills/mjun-specify"
"~/.gemini/antigravity-cli/skills/mjun-start" = "~/.dotfiles/config/ai-agents/skills/mjun-start"
"~/.gemini/antigravity-cli/skills/mjun-steering" = "~/.dotfiles/config/ai-agents/skills/mjun-steering"
"~/.gemini/antigravity-cli/skills/mjun-to-tasks" = "~/.dotfiles/config/ai-agents/skills/mjun-to-tasks"

[dotfiles.vscode-settings]
source = "~/.dotfiles/config/vscode/settings.json"
variants = [
    { os = "macos", target = "~/Library/Application Support/Code/User/settings.json" },
    { os = "linux", target = "~/.config/Code/User/settings.json" },
]

[dotfiles.vscode-keybindings]
source = "~/.dotfiles/config/vscode/keybindings.json"
variants = [
    { os = "macos", target = "~/Library/Application Support/Code/User/keybindings.json" },
    { os = "linux", target = "~/.config/Code/User/keybindings.json" },
]

[dotfiles.iterm2-dynamic-profile]
source = "~/.dotfiles/config/mac/iterm2/DynamicProfiles/dotfiles.json"
variants = [{ os = "macos", target = "~/Library/Application Support/iTerm2/DynamicProfiles/dotfiles.json" }]

[dotfiles.karabiner]
source = "~/.dotfiles/config/mac/karabiner"
variants = [{ os = "macos", target = "~/.config/karabiner" }]
