#:schema https://mise.en.dev/schema/mise.json

[tools]
# Languages & Runtimes
go = "latest"
rust = "latest"
node = "lts"
bun = "latest"
pnpm = "latest"
cmake = "latest"
uv = "latest"

# Shell & CLI utilities
dust = "latest"
jq = "latest"
starship = "latest"
tmux = "latest"
usage = "latest"
yazi = { version = "latest", postinstall = "ya pkg install" }
yq = "latest"
zoxide = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:phiresky/ripgrep-all" = "latest"

# Editor
tree-sitter = "latest"
"aqua:neovim/neovim" = "latest"

# Git
delta = "latest"
git-lfs = "latest"
gh = "latest"
ghq = "latest"
lazygit = "latest"
"github:d-kuro/gwq" = "latest"

# Dev tooling
actionlint = "latest"
aqua = "latest"
container = { version = "latest", os = ["macos"], postinstall = '''
container system start --disable-kernel-install
# kata-static から推奨カーネルを取得して既定化する
container system kernel set --recommended --force
''' }
gcloud = "latest"
gitleaks = "latest"
herdr = { version = "latest", postinstall = '"$HOME"/.dotfiles/script/setup/setup_herdr.sh' }
imagemagick = { version = "latest", os = ["macos"] }
"aqua:imagemagick" = { version = "latest", os = ["linux"] }
kubectl = "latest"
stylua = "latest"
pre-commit = "latest"
prek = "latest"
sheldon = "latest"
shellcheck = "latest"
shfmt = "latest"
"aqua:aws/aws-cli" = "latest"
"github:WGUNDERWOOD/tex-fmt" = "latest"
"github:runpod/runpodctl" = "latest"
"github:rtk-ai/rtk" = "latest"

# npm packages
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:md-to-pdf" = { version = "latest", install_env = { PUPPETEER_SKIP_DOWNLOAD = "1" } }
"npm:neovim" = "latest"
"npm:oxfmt" = "latest"
"npm:prettier" = "latest"
"npm:pyright" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"

# AI coding agents
"npm:agent-browser" = { version = "latest", postinstall = "agent-browser install || echo 'agent-browser browser install skipped'" }
"aqua:anthropics/claude-code" = "latest"
"aqua:openai/codex" = { version = "latest", postinstall = '''
set -eu

current="${CODEX_HOME:-$HOME/.codex}/packages/standalone/current"

mkdir -p "$(dirname "$current")"
ln -sfn bin/codex "$MISE_TOOL_INSTALL_PATH/codex"
ln -sfn "$MISE_TOOL_INSTALL_PATH" "$current"

"$current/codex" app-server daemon enable-remote-control
"$current/codex" app-server daemon restart
"$current/codex" app-server daemon version
''' }
opencode = "latest"
"aqua:google-antigravity/antigravity-cli" = "latest"
"npm:@github/copilot" = "latest"
"npm:@xai-official/grok" = "latest"
apm = "latest"

# Python CLI tools
"pipx:ruff" = "latest"
"pipx:glances" = "latest"
"pipx:nvitop" = "latest"
"pipx:ty" = "latest"
"pipx:copier" = "latest"
"pipx:euporie" = "latest"
"pipx:huggingface_hub" = "latest"

[settings]
idiomatic_version_file_enable_tools = []
pipx.uvx = true
npm.package_manager = "bun"
trusted_config_paths = ["/"]
minimum_release_age = "24h"
minimum_release_age_excludes = [
  "aqua:anthropics/claude-code",
  "aqua:openai/codex",
  "aqua:google-antigravity/antigravity-cli",
]
auto_env = true
not_found_auto_install = false
experimental = true

[tasks.headroom-proxy]
description = "Start the Headroom proxy"
run = """
headroom proxy --host 127.0.0.1 --port 8787 \
  --no-telemetry --disable-kompress --lossless \
  --mode token --code-aware
"""
