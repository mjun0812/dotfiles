#:schema https://mise.en.dev/schema/mise.json

[tools]
# Languages and Runtimes
go = "latest"
rust = "latest"
node = "lts"
bun = "latest"
pnpm = "latest"
cmake = "latest"
uv = "latest"
python = "3.14"
ruby = "latest"

# Shell and CLI utilities
dust = "latest"
jq = "latest"
starship = "latest"
tmux = "latest"
usage = "latest"
yq = "latest"
zoxide = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:phiresky/ripgrep-all" = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:sharkdp/fd" = "latest"

# Git
delta = "latest"
git-lfs = "latest"
gh = { version = "latest", postinstall = "gh extension install github/gh-stack && gh extension upgrade gh-stack" }
hunk = { version = "latest", postinstall = '"$HOME"/.dotfiles/script/setup/setup_hunk.sh' }

# Dev tool
ast-grep = "latest"
duckdb = "latest"
fzf = "latest"
gitleaks = "latest"
herdr = { version = "latest", minimum_release_age = "0s", postinstall = '"$HOME"/.dotfiles/script/setup/setup_herdr.sh' }
hyperfine = "latest"
jactionlint = { version = "latest", minimum_release_age = "0s" }
kubectl = "latest"
ninja = "latest"
stylua = "latest"
prek = "latest"
ruff = "latest"
sheldon = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
ty = "latest"
"aqua:aws/aws-cli" = "latest"
"aqua:neovim/neovim" = "latest"
"github:rtk-ai/rtk" = "latest"
"github:nwiizo/suiko" = "latest"
"github:runpod/runpodctl" = "latest"
"github:WGUNDERWOOD/tex-fmt" = "latest"
"github:jupyter-ai-contrib/nb-cli" = { version = "latest", bin = "nb" }

# npm packages
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:md-to-pdf" = { version = "latest", install_env = { PUPPETEER_SKIP_DOWNLOAD = "1" } }
"npm:neovim" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:prettier" = "latest"
"npm:pyright" = "latest"
"npm:textlint" = { version = "latest", bun_args = """
@textlint-ja/textlint-rule-preset-ai-writing@1.7.0
textlint-rule-no-kangxi-radicals@0.2.2
textlint-rule-preset-ai-words-ja@1.2.1
textlint-rule-preset-ja-technical-writing@12.0.2
textlint-rule-prh@6.1.0
""" }
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"

# AI coding agents
opencode = "latest"
"npm:agent-browser" = { version = "latest", postinstall = "agent-browser install || echo 'agent-browser browser install skipped'" }
"npm:playwriter" = { version = "latest", postinstall = '''
# agent-browser install が入れた Chrome for Testing を共有する
mkdir -p ~/.playwriter
rm -rf ~/.playwriter/browsers
ln -s ~/.agent-browser/browsers ~/.playwriter/browsers
# Linux の常駐ブラウザが旧バージョンの拡張機能を読み込んだままにならないよう再起動する
systemctl --user try-restart dev.mise.playwriter-browser.service 2>/dev/null || true
''' }
"aqua:anthropics/claude-code" = { version = "latest", minimum_release_age = "0s" }
"aqua:openai/codex" = { version = "latest", minimum_release_age = "0s", postinstall = '''
set -eu
ln -sfn bin/codex "$MISE_TOOL_INSTALL_PATH/codex"
"$HOME"/.dotfiles/script/setup/setup_codex_daemon.sh pin
"$MISE_TOOL_INSTALL_PATH/codex" --version
''' }
"aqua:google-antigravity/antigravity-cli" = { version = "latest", minimum_release_age = "0s" }
"github:kenn-io/agentsview" = "latest"

# Python CLI tools
"pypi:copier" = "latest"
"pypi:danielrobbins/keychain" = { version = "latest" }
"pypi:glances" = "latest"
"pypi:huggingface_hub" = "latest"
"pypi:nvitop" = "latest"

[env]
# mise管理のPythonではなく、homeのvenvを使うようにする
_.path = ["~/.venv/bin"]

[settings]
upgrade.auto_prune = false
idiomatic_version_file_enable_tools = []
pypi.uvx = true
npm.package_manager = "bun"
trusted_config_paths = ["/"]
minimum_release_age = "24h"
auto_env = true
not_found_auto_install = false
experimental = true

[settings.ruby]
compile = false

[settings.python]
compile = false

[settings.github]
credential_command = "gh auth token"

[bootstrap.services.headroom-proxy]
scope = "user"
description = "Start the Headroom proxy"
command = "~/.local/share/mise/shims/headroom proxy --host 127.0.0.1 --port 8787 --mode token --no-telemetry --disable-kompress --lossless --code-aware --no-rate-limit"
restart = "always"

[bootstrap.services.cli-proxy-api]
scope = "user"
description = "Start CLIProxyAPI"
command = "~/.local/share/mise/shims/cli-proxy-api"
working_directory = "~/.config/cli-proxy-api"
restart = "always"

[bootstrap.services.codex-app-server-daemon]
scope = "user"
description = "Start the Codex app-server daemon"
# daemonはpidfile管理のdetached processでreboot後に復活しないため、login時に起動する
command = "~/.dotfiles/script/setup/setup_codex_daemon.sh run"
restart = "on-failure"

[tasks.headroom-proxy]
description = "Start the Headroom proxy"
run = """
headroom proxy --host 127.0.0.1 --port 8787 \
  --no-telemetry --disable-kompress --lossless \
  --mode token --code-aware
"""
