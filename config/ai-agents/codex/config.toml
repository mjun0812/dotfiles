#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
web_search = "live"
allow_login_shell = true
suppress_unstable_features_warning = true
service_tier = "default"

[features]
shell_snapshot = true
multi_agent = true
hooks = true
default_mode_request_user_input = true
daemon_auto_start = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 600000
default_wait_timeout_ms = 1800000
max_wait_timeout_ms = 3600000

[agents]
max_concurrent_threads_per_session = 6

[shell_environment_policy]
inherit = "all"
experimental_use_profile = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
resume_cwd = "session"
terminal_title = ["spinner", "project"]
notifications = false
auto_recap = true
status_line = [
  "model-with-reasoning",
  "used-tokens",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "current-dir",
  "git-branch",
]

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]

[mcp_servers.chrome-devtools]
command = "bunx"
args = ["chrome-devtools-mcp@latest"]
startup_timeout_sec = 120

[mcp_servers.context7]
command = "bunx"
args = ["@upstash/context7-mcp@latest"]
startup_timeout_sec = 120

[mcp_servers.drawio]
command = "bunx"
args = ["@drawio/mcp@latest"]
startup_timeout_sec = 120

[plugins."github@openai-curated"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = false
