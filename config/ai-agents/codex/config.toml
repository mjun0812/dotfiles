#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
web_search = "live"
allow_login_shell = true
suppress_unstable_features_warning = true

[features]
shell_snapshot = true
multi_agent = true
hooks = true
default_mode_request_user_input = true
daemon_auto_start = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 600000
default_wait_timeout_ms = 1800000
max_wait_timeout_ms = 3600000

[agents]
max_concurrent_threads_per_session = 6

[shell_environment_policy]
inherit = "all"
experimental_use_profile = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
resume_cwd = "session"
terminal_title = ["spinner", "project"]
notifications = false
auto_recap = true
status_line = [
  "model-with-reasoning",
  "used-tokens",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "current-dir",
  "git-branch",
]

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

# GitHub app (connector)。GitHub操作はgit・gh CLIで行う
[apps.connector_76869538009648d5b282a4bb21c3d157]
enabled = false
