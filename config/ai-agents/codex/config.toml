#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
allow_login_shell = true
suppress_unstable_features_warning = true
service_tier = "default"

[features]
shell_snapshot = true
multi_agent = true
hooks = true
# plan mode以外でもユーザー入力を求められるようにする
default_mode_request_user_input = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 600000
default_wait_timeout_ms = 1800000
max_wait_timeout_ms = 3600000

[agents]
max_depth = 4
max_concurrent_threads_per_session = 6

[sandbox_workspace_write]
writable_roots = ["~/.cache", "~/.local/share", "/tmp", "/private/tmp"]
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[shell_environment_policy]
inherit = "all"
experimental_use_profile = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
# 通知は hooks.json から notify-codex-hook.sh 経由で送るため、組み込み通知は使わない。
notifications = false
status_line = [
  "model-with-reasoning",
  "used-tokens",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "current-dir",
  "git-branch",
]

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]

[mcp_servers.chrome-devtools]
command = "bunx"
args = ["chrome-devtools-mcp@latest"]
startup_timeout_sec = 120

[mcp_servers.context7]
command = "bunx"
args = ["@upstash/context7-mcp@latest"]
startup_timeout_sec = 120

[mcp_servers.drawio]
command = "bunx"
args = ["@drawio/mcp@latest"]
startup_timeout_sec = 120

[plugins."github@openai-curated"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = false
