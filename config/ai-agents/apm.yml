name: mjun
version: 1.0.0
description: APM project for mjun
author: Junya Morioka
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - agent-skills
  - antigravity
  - claude
  - codex
  - opencode
dependencies:
  apm:
    # Each skill is listed by subpath: a whole-package entry with a skills: selection
    # is parked for Claude, which only loads a package with .claude-plugin as a whole plugin.
    - mjun0812/skills/skills/delegation/claude
    - mjun0812/skills/skills/delegation/codex
    - mjun0812/skills/skills/research/deep-research
    - mjun0812/skills/skills/docs/doc-sync
    - mjun0812/skills/skills/tools/duckdb
    - mjun0812/skills/skills/docs/exhtml
    - mjun0812/skills/skills/docs/exmd
    - mjun0812/skills/skills/planning/experiment-plan
    - mjun0812/skills/skills/git/git-commit
    - mjun0812/skills/skills/git/git-fix-conflict
    - mjun0812/skills/skills/git/git-squash
    - mjun0812/skills/skills/github/github-fix-ci
    - mjun0812/skills/skills/github/github-issue-create
    - mjun0812/skills/skills/github/github-issue-update
    - mjun0812/skills/skills/github/github-pr-create
    - mjun0812/skills/skills/github/github-pr-fix
    - mjun0812/skills/skills/github/github-pr-review
    - mjun0812/skills/skills/github/github-resolve-pr-comment
    - mjun0812/skills/skills/writing/japanese-writing
    - mjun0812/skills/skills/docs/chat-note
    - mjun0812/skills/skills/delegation/resume-other-agent
    - mjun0812/skills/skills/review/self-review
    - mjun0812/skills/skills/agent-skill/skill-review
    - mjun0812/skills/skills/review/test-prune
    - mjun0812/skills/skills/tools/wezterm-control
    - mjun0812/skills/skills/agent-skill/writing-skills
    # A subpath entry carries one skill only, so the reviewer agents come from their own package.
    - mjun0812/skills/agents
    - vercel-labs/agent-browser/skills/agent-browser#>=0.36.0
    - vercel-labs/agent-desktop/skills/agent-desktop#>=1.3.0
    - remorses/playwriter/skills/playwriter
    - herdrdev/herdr/skills/herdr#>=0.8.0
    - modem-dev/hunk/packages/hunk/skills/hunk-review#>=0.24.0
    - github/gh-stack/skills/gh-stack#>=0.1.0
    - jupyter-ai-contrib/nb-cli/skills/notebook-cli#>=0.0.10
    - nanaism/yomiyasu/skills/yomiyasu
  # Written into each target's own MCP config (~/.claude.json, ~/.codex/config.toml,
  # ~/.gemini/config/mcp_config.json, ~/.config/opencode/opencode.json).
  # startup_timeout_sec is a Codex key passed
  # through to every target; bunx's first download exceeds Codex's 10s default.
  mcp:
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: bunx
      args: ["chrome-devtools-mcp@latest"]
      startup_timeout_sec: 120
    - name: drawio
      registry: false
      transport: stdio
      command: bunx
      args: ["@drawio/mcp@latest"]
      startup_timeout_sec: 120
    - name: dotfiles-statusline
      targets: [codex]
      registry: false
      transport: stdio
      command: zsh
      args: ["-c", "exec python3 -u ~/.dotfiles/config/ai-agents/codex/statusline.py"]
includes: auto
scripts: {}
