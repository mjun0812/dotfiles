name: mjun
version: 1.0.0
description: APM project for mjun
author: Junya Morioka
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - agent-skills
  - antigravity
  - claude
  - codex
dependencies:
  apm:
    - git: mjun0812/skills
      skills:
        - claude
        - codex
        - cognitive-rhythm-writing
        - deep-research
        - doc-sync
        - duckdb
        - exhtml
        - exmd
        - experiment-plan
        - git-commit
        - git-fix-conflict
        - git-squash
        - github-fix-ci
        - github-issue-create
        - github-issue-update
        - github-pr-create
        - github-pr-fix
        - github-pr-review
        - github-resolve-pr-comment
        - japanese-tech-writing
        - chat-note
        - resume-other-agent
        - self-review
        - skill-review
        - stop-ai-slop-jp
        - test-prune
        - wezterm-control
        - writing-skills
    - git: vercel-labs/agent-browser
      ref: ">=0.36.0"
      skills:
        - agent-browser
    - remorses/playwriter/skills/playwriter
    - herdrdev/herdr/skills/herdr#>=0.8.0
    - github/gh-stack/skills/gh-stack#>=0.1.0
    - jupyter-ai-contrib/nb-cli/skills/notebook-cli#>=0.0.10
  # Written into each target's own MCP config (~/.claude.json, ~/.codex/config.toml,
  # ~/.gemini/config/mcp_config.json). startup_timeout_sec is a Codex key passed
  # through to every target; bunx's first download exceeds Codex's 10s default.
  mcp:
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: bunx
      args: ["chrome-devtools-mcp@latest"]
      startup_timeout_sec: 120
    - name: context7
      registry: false
      transport: stdio
      command: bunx
      args: ["@upstash/context7-mcp@latest"]
      startup_timeout_sec: 120
    - name: drawio
      registry: false
      transport: stdio
      command: bunx
      args: ["@drawio/mcp@latest"]
      startup_timeout_sec: 120
includes: auto
scripts: {}
