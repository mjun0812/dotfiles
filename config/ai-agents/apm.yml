name: mjun
version: 1.0.0
description: APM project for mjun
author: Junya Morioka
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - agent-skills
  - antigravity
  - claude
  - codex
dependencies:
  apm:
    - git: mjun0812/skills
      skills:
        - claude
        - codex
        - deep-research
        - doc-sync
        - exhtml
        - exmd
        - experiment-plan
        - git-commit
        - git-fix-conflict
        - git-squash
        - github-fix-ci
        - github-issue-create
        - github-issue-update
        - github-pr-create
        - github-pr-fix
        - github-pr-review
        - github-resolve-pr-comment
        - japanese-tech-writing
        - chat-note
        - resume-other-agent
        - skill-review
        - stop-ai-slop-jp
        - test-prune
        - wezterm-control
    - git: vercel-labs/agent-browser
      ref: ">=0.36.0"
      skills:
        - agent-browser
    - herdrdev/herdr/skills/herdr#>=0.8.0
    - github/gh-stack/skills/gh-stack#>=0.1.0
    - mizchi/skills/retrospective-codify#62f580819410cb1d398e4d7f234bbd0aad1c1a15
    - mizchi/skills/ast-grep-practice#62f580819410cb1d398e4d7f234bbd0aad1c1a15
    - obra/superpowers/skills/writing-skills#v6.4.2
    - duckdb/duckdb-skills/skills/read-file
    - duckdb/duckdb-skills/skills/query
    - duckdb/duckdb-skills/skills/convert-file
    - duckdb/duckdb-skills/skills/duckdb-docs
    - duckdb/duckdb-skills/skills/s3-explore
    - git: duckdb/duckdb-skills
      path: skills/read-memories
      targets:
        - claude
  mcp: []
includes: auto
scripts: {}
