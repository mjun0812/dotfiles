repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false

      - id: oxfmt
        name: oxfmt
        entry: oxfmt
        language: system
        types_or: [markdown, json, yaml, javascript, jsx, ts, tsx, css]
        # .oxfmtrc.jsonのignorePatternsと同期させること
        # (除外ファイルのみが渡るとoxfmtが「対象なし」でexit 2になるため)
        exclude: |
          (?x)^(
            config/ai-agents/claude/settings\.json|
            config/dot_config/nvim/lazy-lock\.json|
            config/vscode/settings\.json|
            config/vscode/keybindings\.json
          )$
        pass_filenames: true

      - id: shfmt
        name: shfmt
        entry: shfmt -w -s -i 4
        language: system
        types: [shell]
        exclude_types: [zsh]
        pass_filenames: true

      # 設定はリポジトリ直下の.editorconfig ([*.lua]) から読む
      - id: stylua
        name: stylua
        entry: stylua
        language: system
        types: [lua]
        pass_filenames: true

      # mjun系skillの共通原則の写しが正本と一致しているかを確かめる (直すときは --fix)
      - id: mjun-principles
        name: mjun principles in sync
        entry: zsh script/tools/sync_mjun_principles.sh
        language: system
        files: ^config/ai-agents/(mjun-principles/|skills/mjun-[^/]+/principles/)
        pass_filenames: false

      # p10k.zsh: powerlevel10k configureが生成するファイルのため対象外
      - id: shfmt-zsh
        name: shfmt (zsh)
        entry: shfmt -w -s -i 4 --ln=zsh
        language: system
        types: [zsh]
        exclude: ^config/dot/p10k\.zsh$
        pass_filenames: true
