name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # pre-commit hookはlanguage: systemのため、hookが呼ぶツールもここで入れる
      - name: Install lint tools via mise
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            prek = "latest"
            gitleaks = "latest"
            shfmt = "latest"
            stylua = "latest"
            node = "latest"
            "npm:oxfmt" = "latest"

      # agent向けruleのfrontmatterの検査 (script/tools/rule-paths.sh) と、dotfiles.tomlの宣言の検査 (script/tools/check-dotfiles-entries.sh) がzshで動くため
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run prek
        run: prek run --all-files
