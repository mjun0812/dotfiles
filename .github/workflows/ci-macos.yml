name: CI macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: zsh {0}
    env:
      NONINTERACTIVE: "1"
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
      DOTFILES_SKIP_BOOTSTRAP_PACKAGES: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 実マシン・Ubuntu CIと同様に ~/.dotfiles でリポジトリを参照できるようにする
      # (mise postinstallやnotify系スクリプトは ~/.dotfiles 配下のパスを前提とする)
      - name: Link repository to ~/.dotfiles
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Run install script
        run: |
          zsh -e ./install.sh

      - name: Re-run install script (idempotency)
        run: |
          zsh -e ./install.sh

      - name: Verify symlinks (dotfiles)
        run: |
          echo "=== Checking dotfile symlinks ==="
          for f in config/dot/*; do
            name=".$(basename "$f")"
            if [[ -L "$HOME/$name" ]]; then
              echo "✓ $name is a symlink"
            else
              echo "✗ $name is NOT a symlink"
              exit 1
            fi
          done

      - name: Verify symlinks (config)
        run: |
          echo "=== Checking .config symlinks ==="
          for d in config/dot_config/*; do
            name=$(basename "$d")
            target="$HOME/.config/$name"
            if [[ "$name" = "euporie" ]]; then
              target="$HOME/Library/Application Support/euporie/config.json"
              if [[ -f "$target" ]]; then
                echo "✓ Euporie config.json exists"
              else
                echo "✗ Euporie config.json is missing"
                exit 1
              fi
              continue
            fi
            if [[ "$name" = "herdr" ]]; then
              target="$target/config.toml"
            fi
            if [[ "$name" = "cli-proxy-api" ]]; then
              target="$target/config.yaml"
            fi
            if [[ -L "$target" ]]; then
              echo "✓ .config/$name is a symlink"
            else
              echo "✗ .config/$name is NOT a symlink"
              exit 1
            fi
          done

      - name: Verify symlinks (AI agents)
        run: |
          echo "=== Checking AI agent symlinks ==="
          check_link() {
            if [[ -L "$1" ]]; then
              echo "✓ $1 is a symlink"
            else
              echo "✗ $1 is NOT a symlink"
              exit 1
            fi
          }
          for f in CLAUDE.md settings.json mcp.json statusline.py subagent_statusline.py; do
            check_link "$HOME/.claude/$f"
          done
          check_link "$HOME/.codex/AGENTS.md"
          check_link "$HOME/.codex/hooks.json"
          check_link "$HOME/.gemini/GEMINI.md"
          if [[ -f "$HOME/.codex/config.toml" ]]; then
            echo "✓ .codex/config.toml exists"
          else
            echo "✗ .codex/config.toml is missing"
            exit 1
          fi
          for d in config/ai-agents/skills/*(/); do
            name=$(basename "$d")
            for base in "$HOME/.agents/skills" "$HOME/.claude/skills" "$HOME/.gemini/antigravity-cli/skills"; do
              check_link "$base/$name"
            done
          done

      - name: Verify mise installation
        run: |
          echo "=== Checking mise ==="
          source "$HOME/.zshrc"
          mise --version
          echo "✓ mise is installed"

      - name: Verify yobirin profiles
        run: |
          echo "=== Checking yobirin profiles ==="
          source "$HOME/.zshrc"
          yobirin list
          yobirin list --json | jq -e '.bundles | map(.profile) | (index("claude") != null) and (index("codex") != null)' >/dev/null
          echo "✓ yobirin default + claude/codex profiles are installed"

      - name: Verify uv installation
        run: |
          echo "=== Checking uv ==="
          source "$HOME/.zshrc"
          uv --version
          echo "✓ uv is installed"

      - name: Verify sheldon installation
        run: |
          echo "=== Checking sheldon ==="
          source "$HOME/.zshrc"
          sheldon --version
          echo "✓ sheldon is installed"

      - name: Verify Node.js (via mise)
        run: |
          echo "=== Checking Node.js ==="
          source "$HOME/.zshrc"
          node --version
          echo "✓ Node.js is installed"

      - name: Verify bun (via mise)
        run: |
          echo "=== Checking bun ==="
          source "$HOME/.zshrc"
          bun --version
          echo "✓ bun is installed"

      - name: Verify Python virtual environment
        run: |
          echo "=== Checking Python venv ==="
          source "$HOME/.zshrc"
          source "$HOME/.venv/bin/activate"
          python --version
          echo "✓ Python venv is configured"

      - name: Verify Neovim setup
        run: |
          echo "=== Checking Neovim plugins, treesitter parsers, and LSP servers ==="
          source "$HOME/.zshrc"
          nvim --headless -c "luafile $HOME/.dotfiles/script/ci/check_nvim.lua" +qa

      - name: Verify interactive zsh startup
        run: |
          echo "=== Checking interactive zsh ==="
          zsh -i -c "echo ✓ interactive zsh starts successfully"
