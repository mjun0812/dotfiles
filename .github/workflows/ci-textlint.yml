name: CI Textlint

on:
  push:
    branches: [main]
    paths:
      - "config/dot_config/mise/config.toml"
      - "config/textlint/**"
      - "script/tools/textlint.sh"
      - "script/setup/setup_textlint.sh"
      - "script/tests/test_textlint_mise.py"
      - "install.sh"
      - ".github/workflows/ci-textlint.yml"
  pull_request:
    paths:
      - "config/dot_config/mise/config.toml"
      - "config/textlint/**"
      - "script/tools/textlint.sh"
      - "script/setup/setup_textlint.sh"
      - "script/tests/test_textlint_mise.py"
      - "install.sh"
      - ".github/workflows/ci-textlint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textlint:
    name: Textlint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install test runtimes
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            node = "lts"
            bun = "latest"
            python = "3.14"

      - name: Verify the global textlint bundle in an isolated HOME
        run: python script/tests/test_textlint_mise.py
