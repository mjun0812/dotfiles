name: CI macOS Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-macos-packages:
    name: Test macOS packages (${{ matrix.manager }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        manager: [brew, brew-cask]
    env:
      NONINTERACTIVE: "1"
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
      MISE_CONFIG_DIR: ${{ github.workspace }}/config/dot_config/mise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Apply mise bootstrap packages
        run: mise bootstrap packages apply --manager "${{ matrix.manager }}" --yes

      - name: Re-apply mise bootstrap packages (idempotency)
        run: mise bootstrap packages apply --manager "${{ matrix.manager }}" --yes

      - name: Verify mise bootstrap packages
        run: |
          mise bootstrap packages status --json | jq -e --arg manager "${{ matrix.manager }}" '
            .[$manager].available and
            ([.[$manager].packages[].state | startswith("installed")] | all)
          '
