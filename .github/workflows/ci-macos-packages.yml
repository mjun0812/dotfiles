name: CI macOS Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      paths: ^config/dot_config/mise/|^\.github/workflows/(ci-macos-packages|changes)\.yml$

  test-macos-brew-packages:
    name: Test macOS packages
    needs: changes
    # 判定のjobが失敗したとき (outputが空) は、skipせずに実行する
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NONINTERACTIVE: "1"
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
      MISE_CONFIG_DIR: ${{ github.workspace }}/config/dot_config/mise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Apply mise bootstrap packages
        run: mise bootstrap packages apply --manager brew --yes

      - name: Re-apply mise bootstrap packages (idempotency)
        run: mise bootstrap packages apply --manager brew --yes

      - name: Verify mise bootstrap packages
        run: |
          mise bootstrap packages status --json | jq -e --arg manager brew '
            .[$manager].available and
            ([.[$manager].packages[].state | startswith("installed")] | all)
          '

  test-macos-brew-cask-packages:
    name: Test macOS packages
    needs: changes
    # 判定のjobが失敗したとき (outputが空) は、skipせずに実行する
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NONINTERACTIVE: "1"
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
      MISE_CONFIG_DIR: ${{ github.workspace }}/config/dot_config/mise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Apply mise bootstrap packages
        run: mise bootstrap packages apply --manager brew-cask --yes

      - name: Re-apply mise bootstrap packages (idempotency)
        run: mise bootstrap packages apply --manager brew-cask --yes

      - name: Verify mise bootstrap packages
        run: |
          mise bootstrap packages status --json | jq -e --arg manager brew-cask '
            .[$manager].available and
            ([.[$manager].packages[].state | startswith("installed")] | all)
          '

      - name: Verify MacTeX and AeroSpace
        shell: bash
        run: |
          df -h /
          /Library/TeX/texbin/latex --version
          # aerospace --version はAeroSpace.appのサーバーへ接続するため、配置だけを確かめる
          test -d /Applications/AeroSpace.app
          command -v aerospace
          # caskのpkg installer choicesにより、TeX Liveだけが入りGhostscriptとGUI appは入らない
          pkgutil --pkgs | grep -E '^org\.tug\.mactex\.texlive[0-9]+$'
          if pkgutil --pkgs | grep -E '^org\.tug\.mactex\.(ghostscript|gui)'; then
            exit 1
          fi
