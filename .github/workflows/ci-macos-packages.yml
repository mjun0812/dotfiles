name: CI macOS Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      paths: ^config/dot_config/mise/|^\.github/workflows/(ci-macos-packages|changes)\.yml$

  test-macos-brew-packages:
    name: Test macOS packages
    needs: changes
    # 判定のjobが失敗したとき (outputが空) は、skipせずに実行する
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NONINTERACTIVE: "1"
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
      MISE_CONFIG_DIR: ${{ github.workspace }}/config/dot_config/mise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Apply mise bootstrap packages
        run: mise bootstrap packages apply --manager brew --yes

      - name: Re-apply mise bootstrap packages (idempotency)
        run: mise bootstrap packages apply --manager brew --yes

      - name: Verify mise bootstrap packages
        run: |
          mise bootstrap packages status --json | jq -e --arg manager brew '
            .[$manager].available and
            ([.[$manager].packages[].state | startswith("installed")] | all)
          '

  test-macos-brew-cask-packages:
    name: Test macOS packages
    needs: changes
    # 判定のjobが失敗したとき (outputが空) は、skipせずに実行する
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NONINTERACTIVE: "1"
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
      MISE_CONFIG_DIR: ${{ github.workspace }}/config/dot_config/mise
      EXCLUDED_CASK: mactex-no-gui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      # MacTeXはdownloadとpkgのinstallで約10分かかるため、CIでは除外する
      - name: List packages to apply
        run: |
          mise bootstrap packages status --json | jq -r --arg skip "$EXCLUDED_CASK" '
            .["brew-cask"].packages[].package | select(. != $skip) | "brew-cask:\(.)"
          ' > "$RUNNER_TEMP/packages.txt"

      - name: Apply mise bootstrap packages
        run: xargs mise bootstrap packages apply --yes < "$RUNNER_TEMP/packages.txt"

      - name: Re-apply mise bootstrap packages (idempotency)
        run: xargs mise bootstrap packages apply --yes < "$RUNNER_TEMP/packages.txt"

      - name: Verify mise bootstrap packages
        run: |
          mise bootstrap packages status --json | jq -e --arg manager brew-cask --arg skip "$EXCLUDED_CASK" '
            .[$manager].available and
            ([.[$manager].packages[] | select(.package != $skip) | .state | startswith("installed")] | all)
          '

      # aerospace --version はAeroSpace.appのサーバーへ接続するため、配置だけを確かめる
      - name: Verify AeroSpace
        run: |
          test -d /Applications/AeroSpace.app
          command -v aerospace
