# agentsview serveの前にsessionをrsyncで取得するリモートホスト (git管理外)。
# script/tools/pull_agentsview_remotes.pyが、このファイルが無いときだけdotfilesのtemplates/からコピーする。
#
# テーブル名はsshの接続先 (~/.ssh/configのホスト名)。agentsはclaude / codex / gemini / antigravity-cli / opencode / piから選ぶ。
# 取得先は~/.agentsview/remote/<host>/<agent>で、対応する[[session_sources]]を
# ~/.agentsview/config.tomlへ自動で追記する。ホストやagentを外したときは、config.tomlの該当entryを手で消す。
#
# [devbox1]
# agents = ["claude", "codex"]
